# Server Configuration
server.port=8080

# Application Name
spring.application.name=ai-assignment-evaluator-backend

# MySQL Primary DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_evaluator_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Gemini AI Evaluation Engine Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Logging
logging.level.com.evaluator=INFO
logging.level.org.springframework.security=WARN
